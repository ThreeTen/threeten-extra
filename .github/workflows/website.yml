name: Website

on:
  push:
    tags:
      - 'website*'
  workflow_dispatch:

permissions:
  contents: read  # only the initial checkout uses GITHUB_TOKEN, all pushes use PERSONAL_GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}
        fetch-tags: true
        persist-credentials: false

    - name: Setup git
      run: |
        git config --global user.name "Stephen Colebourne (CI)"
        git config --global user.email "scolebourne@joda.org"

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Maven version
      run: |
        mkdir -p ./.mvn
        echo "-e" >> ./.mvn/maven.config
        echo "-B" >> ./.mvn/maven.config
        echo "-ntp" >> ./.mvn/maven.config
        echo "-DtrimStackTrace=false" >> ./.mvn/maven.config
        echo "--settings" >> ./.mvn/maven.config
        echo "$( pwd )/.github/maven-settings.xml" >> ./.mvn/maven.config
        mvn --version
        mkdir -p target

    #------------------------------------------------------------------------
    - name: Maven site
      run: |
        mvn install site

    - name: Checkout website
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # a PAT is required because GITHUB_TOKEN only grants access to this repository, not threeten.github.io
        token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        repository: ThreeTen/threeten.github.io
        path: target/threeten.github.io
        ref: "main"

    - name: Update website
      run: |
        cd target/threeten.github.io
        git status
  
        rm -rf threeten-extra/
        cp -R ../site threeten-extra/
  
        git add -A
        git status
        git commit --message "Update threeten-extra from CI: $GITHUB_RUN_ID"
  
        git push origin main

    - name: Delete website tag
      if: always() && startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      run: |
        gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" \
          || echo "::warning::failed to delete tag $GITHUB_REF_NAME"
