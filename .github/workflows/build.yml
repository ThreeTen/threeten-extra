name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read  # overridden by job-level permissions below

jobs:
  build:
    permissions:
      contents: read  # job-level permissions replace the workflow-level block, so repeat it here
      security-events: write  # for github/codeql-action
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11, 21]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Maven version
      run: |
        mkdir -p ./.mvn
        echo "-e" >> ./.mvn/maven.config
        echo "-B" >> ./.mvn/maven.config
        echo "-ntp" >> ./.mvn/maven.config
        echo "-DtrimStackTrace=false" >> ./.mvn/maven.config
        echo "--settings" >> ./.mvn/maven.config
        echo "$( pwd )/.github/maven-settings.xml" >> ./.mvn/maven.config
        mvn --version
        mkdir -p target

    #------------------------------------------------------------------------
    - name: Initialize CodeQL
      if: matrix.java == '11'
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: java

    - name: Maven build
      run: |
        mvn install site

    - name: Perform CodeQL Analysis
      if: matrix.java == '11'
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
