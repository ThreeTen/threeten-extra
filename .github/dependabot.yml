# Dependabot config

version: 2
updates:
- package-ecosystem: "maven"
  directory: "/"
  schedule:
    interval: weekly
    time: "02:30"
  cooldown:
    default-days: 5
  open-pull-requests-limit: 20

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    time: "02:30"
  cooldown:
    default-days: 5
